; Session 06 — Smart Alarm Clock
; Board: ESP32-S3-DevKitC-1 (or any ESP32-S3 module)
; Adjust `board` to match your exact PCB if needed.

[env:esp32s3]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

lib_deps =
    links2004/WebSockets @ ^2.4.1
    bblanchon/ArduinoJson @ ^7.0.0
    ; libopus for decoding TTS audio frames from the server (EdgeTTS → Opus)
    https://github.com/pschatzmann/arduino-libopus.git

monitor_speed  = 115200
monitor_filter = esp32_exception_decoder

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_LOG_COLORS=1
