; ── HS-01 Chatbot — ESP32-S3 voice assistant ─────────────────────
; Hold button → talk → release → server does STT+LLM → Opus TTS plays back.
; Protocol : xiaozhi WebSocket (totomo-voice-server)
; Server   : totomo-voice.fly.dev  port 80

[env:esp32s3]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

lib_deps =
    links2004/WebSockets @ ^2.4.1
    bblanchon/ArduinoJson @ ^7.0.0
    https://github.com/pschatzmann/arduino-libopus.git

monitor_speed  = 115200
monitor_filter = esp32_exception_decoder

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_LOG_COLORS=1
