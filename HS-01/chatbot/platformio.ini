[env:esp32s3]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

lib_deps =
    links2004/WebSockets @ ^2.4.1
    bblanchon/ArduinoJson @ ^7.0.0
    https://github.com/pschatzmann/arduino-libopus.git
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.0
    adafruit/Adafruit GFX Library @ ^1.11.0
    tzapu/WiFiManager @ ^2.0.17
    bitbank2/AnimatedGIF @ ^2.1.1

monitor_speed  = 115200

; Same firmware, pointed at a voice server running on the Mac
; (`python app.py` in totomo-voice-server). Update the IP if the Mac's changes.
[env:local]
extends     = env:esp32s3
build_flags = -DSERVER_HOST=\"192.168.1.248\" -DSERVER_PORT=8000
