; ── HS-01 Chatbot — ESP32-S3 voice assistant ─────────────────────
; Boot: on-screen WiFi picker (single button) or phone AP setup.
; Chat: hold button → speak → server → Opus TTS plays back.
; Server: totomo-voice.fly.dev  port 80

[env:esp32s3]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

lib_deps =
    links2004/WebSockets @ ^2.4.1
    bblanchon/ArduinoJson @ ^7.0.0
    https://github.com/pschatzmann/arduino-libopus.git
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.0
    adafruit/Adafruit GFX Library @ ^1.11.0
    tzapu/WiFiManager @ ^2.0.17

monitor_speed  = 115200
monitor_filter = esp32_exception_decoder

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_LOG_COLORS=1
